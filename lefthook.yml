# Lefthook git hooks configuration
# Docs: https://lefthook.dev/configuration/
#
# Runs formatting and lint on staged files, then a project typecheck, before
# each commit. Install hooks: bunx lefthook install
#
# Format and lint only see staged files, so a commit stays quick. Typecheck
# covers the whole project. CI runs the full check.

pre-commit:
  no_stash: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,json,css}'
      run: bunx prettier --check {staged_files}
    - name: lint
      glob: '*.{ts,tsx}'
      run: bunx eslint {staged_files}
    - name: typecheck
      run: bun run typecheck
